image: maven:3.9.6-eclipse-temurin-21

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

cache:
  paths:
    - .m2/repository/
stages:
  - test
  - build

#Prima cosa : Esegue i test e controlla coverage
test_and_coverage:
  stage: test
  script:
    - mvn clean verify
    # scriptino per stampare la % nel log cosi GitLAb crea il badge
    - awk -F"," '{ instructions += $4 + $5; covered += $5 } END { print "Total Coverage:", 100*covered/instructions, "%" }' target/site/jacoco/jacoco.csv
  coverage: '/Total Coverage: ([0-9]{1,3}\.[0-9]*)/'

# Job 2: Compila il jar solo se passano i test
package_app:
  stage: build
  script:
    - mvn clean package
  artifacts:
    paths:
      - target/*.jar
    needs: ["test_and_coverage"]